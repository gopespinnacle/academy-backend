    prevX = (e.clientX - rect.left) * (screenCanvas.width / rect.width);
    prevY = (e.clientY - rect.top) * (screenCanvas.height / rect.height);
});

screenCanvas.addEventListener("pointermove", (e) => {

    if(!isDrawingPointer) return;

async function loadPDFToCanvas(url){
    drawCanvas.style.pointerEvents = "auto";
sessionStorage.setItem("pdfOpen", "true");
    document.getElementById("pdfWindow").style.display = "block";
    dctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
    document.getElementById("pdfTab").style.display = "none";

    const loadingTask = pdfjsLib.getDocument(url);
    const pdf = await loadingTask.promise;

    const container = document.getElementById("pdfWindow");

    // 🔥 REMOVE OLD PAGES
    const oldCanvases = container.querySelectorAll("canvas.pdfPage");
    oldCanvases.forEach(c => c.remove());

    for(let i = 1; i <= pdf.numPages; i++){

        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 1.2 });

        const pageCanvas = document.createElement("canvas");
        pageCanvas.className = "pdfPage";

        pageCanvas.width = viewport.width;
        pageCanvas.height = viewport.height;

        const pageCtx = pageCanvas.getContext("2d");

        await page.render({
            canvasContext: pageCtx,
            viewport: viewport
        }).promise;

        container.appendChild(pageCanvas);
    }
    drawCanvas.width = container.scrollWidth;
drawCanvas.height = container.scrollHeight;


}

async function saveAsPDF(){

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();

    const isPDFOpen = document.getElementById("pdfWindow").style.display === "block";

    // ================= CASE 1 & 2 (WHITE / LINES) =================
    if(!isPDFOpen){

        // convert mainBoard to image
        const imgData = mainBoard.toDataURL("image/png");

        pdf.addImage(imgData, 'PNG', 0, 0, 210, 297);
        pdf.save("whiteboard.pdf");

        return;
    }

    // ================= CASE 3 (UPLOADED PDF + DRAWING) =================

    const pages = document.querySelectorAll(".pdfPage");

    for(let i = 0; i < pages.length; i++){

        const pageCanvas = pages[i];

        // create temp canvas
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = pageCanvas.width;
        tempCanvas.height = pageCanvas.height;

        const tempCtx = tempCanvas.getContext("2d");

        // draw PDF page
        tempCtx.drawImage(pageCanvas, 0, 0);

        // draw annotations
        tempCtx.drawImage(drawCanvas, 0, 0);

        const imgData = tempCanvas.toDataURL("image/png");

        if(i > 0) pdf.addPage();

        pdf.addImage(imgData, 'PNG', 0, 0, 210, 297);
    }

    pdf.save("annotated.pdf");
}

async function initARFilter(){

const dogImg = new Image();

dogImg.src = "images/dogears.png";
    JEELIZFACEFILTER.init({

        canvasId: "jeeFaceFilterCanvas",

        "https://appstatic.jeeliz.com/faceFilter/",

            if(errCode){

            );
        },
        
callbackTrack: function(detectState){

    const canvas =
    document.getElementById(
        "arOverlay"
    );
    const ctx =
        canvas.getContext("2d");

    // MATCH SIZE
    canvas.width =
        canvas.offsetWidth;

    canvas.height =
        canvas.offsetHeight;

    // CLEAR
    ctx.clearRect(
        0,
        0,
        canvas.width, 
        canvas.height
    );

    // FACE FOUND
    if(detectState.detected > 0.6){

        // CENTER
        const x =
            canvas.width / 2;

        const y =
            canvas.height / 2;

        // SCALE
        const scale =
            detectState.s * 220;

        // ROTATION
        const rot =
            detectState.ry;

        ctx.save();

        // MOVE TO HEAD
        ctx.translate(
            x,
            y - 80
        );

        // ROTATE WITH HEAD
        ctx.rotate(rot);

        // DRAW FILTER
        ctx.drawImage(
            dogImg,
            -scale/2,
            -scale/1.2,
            scale,
            scale * 0.7
        );

        ctx.restore();
    }
}
    });
