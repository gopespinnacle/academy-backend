let isDrawingPointer = false;


// 🔥 SCREEN DRAW POINTER EVENTS
screenCanvas.addEventListener("pointerdown", (e) => {
    if(role !== "teacher") return;

    isDrawingPointer = true;

    const rect = screenCanvas.getBoundingClientRect();

    prevX = (e.clientX - rect.left) * (screenCanvas.width / rect.width);
    prevY = (e.clientY - rect.top) * (screenCanvas.height / rect.height);
});

screenCanvas.addEventListener("pointermove", (e) => {

    if(!isDrawingPointer) return;
    if(role !== "teacher") return;

    const rect = screenCanvas.getBoundingClientRect();

    const x = (e.clientX - rect.left) * (screenCanvas.width / rect.width);
    const y = (e.clientY - rect.top) * (screenCanvas.height / rect.height);

    screenCtx.beginPath();
    screenCtx.moveTo(prevX, prevY);
    screenCtx.lineTo(x, y);
    
    screenCtx.lineWidth = 3;
    screenCtx.lineCap = "round";
    screenCtx.stroke();

    socket.emit("screenDraw", {
        room,
        prevX,
        prevY,
        x,
        y,
       
    });

    prevX = x;
    prevY = y;
});

screenCanvas.addEventListener("pointerup", () => {
    isDrawingPointer = false;
});

async function createOffer(){

});

async function loadPDFToCanvas(url){
    drawCanvas.style.pointerEvents = "auto";
localStorage.setItem("pdfOpen", "true");
    document.getElementById("pdfWindow").style.display = "block";
    dctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
    document.getElementById("pdfTab").style.display = "none";

    const loadingTask = pdfjsLib.getDocument(url);
    const pdf = await loadingTask.promise;

    const container = document.getElementById("pdfWindow");

    // 🔥 REMOVE OLD PAGES
    const oldCanvases = container.querySelectorAll("canvas.pdfPage");
    oldCanvases.forEach(c => c.remove());

    for(let i = 1; i <= pdf.numPages; i++){

        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 1.2 });

        const pageCanvas = document.createElement("canvas");
        pageCanvas.className = "pdfPage";

        pageCanvas.width = viewport.width;
        pageCanvas.height = viewport.height;

        const pageCtx = pageCanvas.getContext("2d");

        await page.render({
            canvasContext: pageCtx,
            viewport: viewport
        }).promise;

        container.appendChild(pageCanvas);
    }
    drawCanvas.width = container.scrollWidth;
drawCanvas.height = container.scrollHeight;


}

async function saveAsPDF(){

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();

    const isPDFOpen = document.getElementById("pdfWindow").style.display === "block";

    // ================= CASE 1 & 2 (WHITE / LINES) =================
    if(!isPDFOpen){

        // convert mainBoard to image
        const imgData = mainBoard.toDataURL("image/png");

        pdf.addImage(imgData, 'PNG', 0, 0, 210, 297);
        pdf.save("whiteboard.pdf");

        return;
    }

    // ================= CASE 3 (UPLOADED PDF + DRAWING) =================

    const pages = document.querySelectorAll(".pdfPage");

    for(let i = 0; i < pages.length; i++){

        const pageCanvas = pages[i];

        // create temp canvas
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = pageCanvas.width;
        tempCanvas.height = pageCanvas.height;

        const tempCtx = tempCanvas.getContext("2d");

        // draw PDF page
        tempCtx.drawImage(pageCanvas, 0, 0);

        // draw annotations
        tempCtx.drawImage(drawCanvas, 0, 0);

        const imgData = tempCanvas.toDataURL("image/png");

        if(i > 0) pdf.addPage();

        pdf.addImage(imgData, 'PNG', 0, 0, 210, 297);
    }

    pdf.save("annotated.pdf");
}

callbackTrack: function(detectState){

    const canvas =
    document.getElementById(
        "arOverlay"
    );
    const ctx =
        canvas.getContext("2d");

    // MATCH SIZE
    canvas.width =
        canvas.offsetWidth;

    canvas.height =
        canvas.offsetHeight;

    // CLEAR
    ctx.clearRect(
        0,
        0,
        canvas.width, 
        canvas.height
    );

    // FACE FOUND
    if(detectState.detected > 0.6){

        // CENTER
        const x =
            canvas.width / 2;

        const y =
            canvas.height / 2;

        // SCALE
        const scale =
            detectState.s * 220;

        // ROTATION
        const rot =
            detectState.ry;

        ctx.save();

        // MOVE TO HEAD
        ctx.translate(
            x,
            y - 80
        );

        // ROTATE WITH HEAD
        ctx.rotate(rot);

        // DRAW FILTER
        ctx.drawImage(
            dogImg,
            -scale/2,
            -scale/1.2,
            scale,
            scale * 0.7
        );

        ctx.restore();
    }
}
    });
}

async function initMedia(cameraId = null){

    if(localStream){
        localStream.getTracks().forEach(t => t.stop());
    }

    localStream =
    await navigator.mediaDevices.getUserMedia({

        video: cameraId
        ? { deviceId: { exact: cameraId } }
        : true,

        audio:false
    });

    const localVideo =
        document.getElementById("localVideo");

    localVideo.srcObject = localStream;

    await localVideo.play();


}
let pc;
async function loadCameraList(){

    const devices =
    await navigator.mediaDevices.enumerateDevices();

    const cams =
        devices.filter(
            d => d.kind === "videoinput"
        );

    const select =
        document.getElementById(
            "cameraSelect"
        );

    select.innerHTML = "";

    cams.forEach(cam => {

        const option =
            document.createElement(
                "option"
            );

        option.value = cam.deviceId;

        option.text =
            cam.label ||
            "Camera";

        select.appendChild(option);
    });
}
async function switchCamera(deviceId){

    currentCameraId = deviceId;

    await initMedia(deviceId);

    const sender =
        pc.getSenders().find(
            s =>
            s.track &&
            s.track.kind === "video"
        );

    if(sender){

        sender.replaceTrack(
            localStream
            .getVideoTracks()[0]
        );
    }
}

let screenStream;

async function startScreenShare(){

    if(role !== "teacher") return;

    try{
        screenStream = await navigator.mediaDevices.getDisplayMedia({
    video: true,
    audio: true
});

        const screenTrack = screenStream.getVideoTracks()[0];

        // 🔥 THIS WAS MISSING (VERY IMPORTANT)
        const videoSender = pc.getSenders().find(
    s => s.track && s.track.kind === "video"
);

if(videoSender){
    videoSender.replaceTrack(screenTrack);
}

// 🔥 ADD AUDIO TRACK ALSO
const audioTrack = screenStream.getAudioTracks()[0];

if(audioTrack){

    const audioSender = pc.getSenders().find(
        s => s.track && s.track.kind === "audio"
    );

    if(audioSender){
        audioSender.replaceTrack(audioTrack);
    }
}
    }catch(err){
        console.log("Screen share error:", err);
    }
}

async function stopScreenShare(){

    if(!screenStream) return;

    const videoTrack = localStream.getVideoTracks()[0];

    const sender = pc.getSenders().find(s => s.track.kind === "video");

    if(sender){
        sender.replaceTrack(videoTrack);   // back to camera
    }

    document.getElementById("localVideo").srcObject = localStream;

    screenStream.getTracks().forEach(track => track.stop());
    screenStream = null;
}

const pip = document.getElementById("screenContainer");
const header = document.getElementById("pipHeader");

let isDragging = false;
let offsetX, offsetY;

header.addEventListener("mousedown", (e) => {
    isDragging = true;
    offsetX = e.clientX - pip.offsetLeft;
    offsetY = e.clientY - pip.offsetTop;
});

document.addEventListener("mousemove", (e) => {
    if (!isDragging) return;

    pip.style.left = (e.clientX - offsetX) + "px";
    pip.style.top = (e.clientY - offsetY) + "px";
    pip.style.right = "auto";
});

document.addEventListener("mouseup", () => {
    isDragging = false;
});

// MINIMIZE
function minimizePiP(){
    pip.classList.toggle("minimized");
}

// RESET
let isMaximized = false;

function resetPiP(){

    if(!isMaximized){

        // 🔥 FULL SCREEN
        pip.style.top = "60px";
        pip.style.left = "0";
        pip.style.right = "0";

        pip.style.width = "100vw";
        pip.style.height = "calc(100vh - 60px)";

        pip.style.zIndex = "9999";

        isMaximized = true;

    }else{

        // 🔥 BACK TO SMALL SIZE
        pip.style.top = "90px";
        pip.style.right = "10px";
        pip.style.left = "auto";

        pip.style.width = "180px";
        pip.style.height = "120px";

        isMaximized = false;
    }

    pip.classList.remove("minimized");
}
let isAudioOn = true;
let isVideoOn = true;

// 🎤 TOGGLE AUDIO
function toggleAudio(){

    if(!localStream) return;

    const audioTrack = localStream.getAudioTracks()[0];
    if(!audioTrack) return;

    isAudioOn = !isAudioOn;
    audioTrack.enabled = isAudioOn;

    // change button text
    event.target.innerText = isAudioOn ? "🎤 Mute" : "🔇 Unmute";
}

// 📷 TOGGLE VIDEO
function toggleVideo(){

    if(!localStream) return;

    const videoTrack = localStream.getVideoTracks()[0];
    if(!videoTrack) return;

    isVideoOn = !isVideoOn;
    videoTrack.enabled = isVideoOn;

    event.target.innerText = isVideoOn ? "📷 Stop Video" : "📷 Start Video";
}

// FLOATING EFFECT
function showFloatingEmoji(emoji){

    const div =
        document.createElement("div");

    div.innerHTML = emoji;

    div.style.position = "fixed";

    div.style.bottom = "100px";

    div.style.left =
        Math.random()*80 + "%";

    div.style.fontSize = "70px";

    div.style.zIndex = "999999";

    div.style.transition =
        "all 2s ease";

    document.body.appendChild(div);

    setTimeout(()=>{

        div.style.transform =
            "translateY(-300px)";

        div.style.opacity = "0";

    },100);

    setTimeout(()=>{

        div.remove();

    },2200);
}
