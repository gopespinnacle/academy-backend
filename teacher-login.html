<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
}

.login-page{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
    rgba(255,255,255,.65),
    rgba(255,255,255,.65)
    ),
    url("images/image1.png");

    background-size:cover;
    background-position:center;
}

.login-box{

    width:90%;
    max-width:420px;

    background:white;

    padding:40px;

    border-radius:25px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.15);
}

.login-box img{

    width:180px;
    display:block;
    margin:auto;
}

.login-box h2{

    text-align:center;
}

.input-box{

    margin-bottom:20px;
}

.input-box input{

    width:100%;
    height:50px;
}

.login-btn{

    width:100%;
    height:55px;

    border:none;

    border-radius:30px;

    color:white;

    background:
    linear-gradient(
    90deg,
    #1e045c,
    #337dec
    );
}
@media(max-width:768px){

.login-page{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
    linear-gradient(
    rgba(255,255,255,.65),
    rgba(255,255,255,.65)
    ),
    url("images/image1.png");

    background-size:cover;
    background-position:center;
}

.login-box{

    width:92%;

    max-width:none;

    background:white;

    border-radius:30px;

    padding:40px 30px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.18);

}

.login-box img{
    width:220px;
    display:block;
    margin:0 auto 20px;
}

.login-box h2{

    text-align:center;

    font-size:36px;

    margin-bottom:35px;

    color:#222;
}

.input-box{

    margin-bottom:18px;
}

.input-box input{

    width:100%;

    height:65px;

    font-size:18px;

    border:none;

    border-bottom:
    2px solid #ddd;

    border-radius:0;

    background:none;
}

.login-btn{

    width:100%;

    height:65px;

    border:none;

    border-radius:30px;

    font-size:20px;

    font-weight:bold;
    letter-spacing:1px;
    color:white;

    background:
    linear-gradient(
    90deg,
    #1e045c,
    #337dec
    );
}

.remember{

    margin:15px 0 20px;
}

}

</style>
</head>

<body class="login-page">

<div class="login-box">

    <img src="images/logo.png">
    <h2>Teacher Login</h2>

    <div class="input-box">
        <i class="fa fa-user"></i>
        <input type="text" id="email" placeholder="Teacher Email">
    </div>

    <div class="input-box">
        <i class="fa fa-lock"></i>
        <input type="password" id="password" placeholder="Password">
    </div>

    <div class="remember">
        <input type="checkbox"> Remember Me
    </div>

    <button type="button" class="login-btn" onclick="loginTeacher()">Login</button>
      
</div>

<script>

async function loginTeacher() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Please enter email and password");
        return;
    }

    try {

        const response = await fetch("https://academy-backend-eatl.onrender.com/api/auth/login", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({

    email,

    password,

    role: "teacher"

})
});

console.log("Response received:", response);

        const data = await response.json();
console.log("DATA:", data);
       
// ❌ if response failed
if (!response.ok) {
    alert(data.message || "Login failed");
    return;
}

// ❌ if user missing
// ❌ if not teacher
if (data.role !== "teacher") {
    alert("Access denied. Not a Teacher account.");
    return;
}

// ✅ SAVE DATA (BASED ON YOUR BACKEND)
sessionStorage.setItem(
"token",
data.token
);

sessionStorage.setItem(
"role",
data.role
);

sessionStorage.setItem(
"teacherId",
data.user._id
);

sessionStorage.setItem(
"teacherName",
data.user.studentName
);

console.log(
"Teacher Saved:",
data.user.studentName
);

console.log(
"Teacher Login Data:",
data
);

console.log(
"Teacher User:",
data.user
);
sessionStorage.setItem(
"meetingLink",
data.user.meetingLink
);

console.log(
"Teacher Saved:",
data.user.name
);

window.location.href =
"teacher-dashboard.html";

    } catch (error) {
    console.error(error);
    alert("Login error - check API URL or backend route");
}
}
  </script>

</body>
</html>
