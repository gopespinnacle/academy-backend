<h2 style="
display:flex;
justify-content:space-between;
align-items:center;
">

<span>Upload Homework</span>

<button onclick="
window.location.href='student-dashboard.html'
"
style="
background:#1e3a5f;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
">

← Back

</button>

</h2>

<table style="
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
margin-bottom:30px;
">

<thead>

<tr style="
background:#1e3a5f;
color:white;
">

<th style="padding:12px;">
Teacher
</th>

<th>
Class
</th>

<th>
Subject
</th>

<th>
Homework Given
</th>

<th>
Date
</th>
<th>
Choose File
</th>

<th>
Upload
</th>
</tr>

</thead>

<tbody id="homeworkBody">

</tbody>

</table>

<div style="
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
">

<label>
Subject
</label>

<br><br>

<input
id="subject"

style="
width:300px;
padding:10px;
margin-bottom:20px;
">

<br>

<input
type="file"
id="file">

<button

onclick="uploadHomework()"

style="
margin-left:20px;
background:#1e3a5f;
color:white;
border:none;
padding:10px 20px;
border-radius:6px;
cursor:pointer;
">

Upload Homework

</button>

</div>

<script>

async function loadHomeworkDetails(){

const studentName =
localStorage.getItem(
"studentName"
);

console.log(
"studentName:",
studentName
);

if(!studentName){

alert(
"Student name not found. Login again."
);

window.location.href =
"student-login.html";

return;

}

const res =
await fetch(

"https://academy-backend-eatl.onrender.com/api/teacher-homeworks"

);

const allData =
await res.json();

const className =
localStorage.getItem(
"className"
) || "";

console.log(
"className:",
className
);

const data =
allData.filter(x =>

x.studentName &&

x.studentName
.toLowerCase()
.trim()

===

studentName
.toLowerCase()
.trim()

);

console.log(
"Filtered:",
data
);

let html = "";

data.forEach(x=>{

html += `

<tr>

<td style="padding:12px;">
${x.teacherName || "-"}
</td>

<td>
${x.className || "-"}
</td>

<td>
${x.subject || "-"}
</td>

<td>
${x.homework || "-"}
</td>

<td>
${x.date || "-"}
</td>

<td>

<input
type="file"
id="file${x._id}"
>

</td>

<td>

<button
onclick="uploadHomework('${x._id}')"
style="
background:#1e3a5f;
color:white;
border:none;
padding:8px 15px;
border-radius:6px;
cursor:pointer;
">

Upload

</button>

</td>

</tr>

`;

});

document.getElementById(
"homeworkBody"
).innerHTML = html;

if(data.length > 0){

document.getElementById(
"subject"
).value =

data[
data.length - 1
].subject || "";

}

}

async function uploadHomework(homeworkId){

const fd =
new FormData();

fd.append(
"file",
document.getElementById(
"file" + homeworkId
).files[0]
);

fd.append(
"studentName",
localStorage.getItem(
"studentName"
)
);

fd.append(
"studentId",
localStorage.getItem(
"studentId"
)
);

fd.append(
"className",
localStorage.getItem(
"className"
)
);

fd.append(
"subject",
document.getElementById(
"subject"
).value
);

fd.append(
"homeworkId",
homeworkId
);

const res =
await fetch(

"https://academy-backend-eatl.onrender.com/api/upload-homework",

{
method:"POST",
body:fd
}

);

await res.json();

alert(
"Uploaded Successfully"
);

}

loadHomeworkDetails();

</script>
