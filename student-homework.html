<h2 style="
display:flex;
justify-content:space-between;
align-items:center;
">

<span>Upload Homework</span>

<button onclick="
window.location.href='student-dashboard.html'
"
style="
background:#1e3a5f;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
">

← Back

</button>

</h2>

<table style="
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
margin-bottom:30px;
">

<thead>

<tr style="
background:#1e3a5f;
color:white;
">

<th style="padding:12px;">
Teacher
</th>

<th>
Class
</th>

<th>
Subject
</th>

<th>
Homework Given
</th>

<th>
Date
</th>
<th>
Choose File
</th>

<th>
Upload
</th>
</tr>

</thead>

<tbody id="homeworkBody">

</tbody>

</table>
<script>

async function loadHomeworkDetails(){

const studentName =
localStorage.getItem(
"studentName"
);

console.log(
"studentName:",
studentName
);

if(!studentName){

alert(
"Student name not found. Login again."
);

window.location.href =
"student-login.html";

return;

}

const res =
await fetch(

"https://academy-backend-eatl.onrender.com/api/teacher-homeworks"

);

const allData =
await res.json();

const className =
localStorage.getItem(
"className"
) || "";

console.log(
"className:",
className
);

const data =
allData.filter(x =>

x.studentName &&

x.studentName
.toLowerCase()
.trim()

===

studentName
.toLowerCase()
.trim()

);

console.log(
"Filtered:",
data
);

let html = "";

data.forEach((x,index)=>{

html += `

<tr
data-hw="${x.homeworkUniqueId || ''}"
>

<td style="padding:12px;">
${x.teacherName || "-"}
</td>

<td>
${x.className || "-"}
</td>

<td>
${x.subject || "-"}
</td>

<td>
${x.homework || "-"}
</td>

<td>
${x.date || "-"}
</td>

<td>

<input
type="file"
id="file${x.summaryId}"
>

</td>

<td>

<button
onclick="uploadHomework('${x.summaryId}')"
style="
background:#1e3a5f;
color:white;
border:none;
padding:8px 15px;
border-radius:6px;
cursor:pointer;
">

Upload

</button>

</td>

</tr>

`;

});

document.getElementById(
"homeworkBody"
).innerHTML = html;

}

async function uploadHomework(homeworkId){

const fileInput =
document.getElementById(
"file" + homeworkId
);

if(
!fileInput ||
!fileInput.files[0]
){
alert("Choose file first");
return;
}

const fd =
new FormData();

fd.append(
"file",
fileInput.files[0]
);

fd.append(
"homeworkId",
homeworkId
);

fd.append(
"studentName",
localStorage.getItem(
"studentName"
)
);

fd.append(
"studentId",
localStorage.getItem(
"studentId"
)
);

fd.append(
"className",
localStorage.getItem(
"className"
)
);

const selectedHomework =
document.querySelector(
`button[onclick="uploadHomework('${homeworkId}')"]`
)
.closest("tr");

const subject =
selectedHomework.children[2]
.innerText;

fd.append(
"subject",
subject
);

const homeworkUniqueId =

selectedHomework
.getAttribute(
"data-hw"
);

fd.append(

"homeworkUniqueId",

homeworkUniqueId

);

const res =
await fetch(

"https://academy-backend-eatl.onrender.com/api/upload-homework",

{
method:"POST",
body:fd
}

);

const data =
await res.json();

console.log(data);

if(data.success){

alert(
"Uploaded Successfully"
);

}else{

alert(
data.message ||
"Upload Failed"
);

}

}

loadHomeworkDetails();

</script>
