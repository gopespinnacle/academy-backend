<h2>Upload Homework</h2>

<div style="
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
">

<h3>Homework Details</h3>

<p>
<b>Teacher :</b>
<span id="teacherName">-</span>
</p>

<p>
<b>Class :</b>
<span id="className">-</span>
</p>

<p>
<b>Subject :</b>
<span id="homeworkSubject">-</span>
</p>

<p>
<b>Homework Given :</b>
<span id="homeworkText">-</span>
</p>

</div>

<input id="subject">

<input
type="file"
id="file">

<button onclick="uploadHomework()">
Upload
</button>

<script>

async function loadHomeworkDetails(){

const studentName =
localStorage.getItem(
"studentName"
);

const className =
localStorage.getItem(
"className"
);

const subject =
localStorage.getItem(
"subject"
);

const res =
await fetch(

`https://academy-backend-eatl.onrender.com/api/teacher-homeworks?studentName=${encodeURIComponent(studentName)}&className=${encodeURIComponent(className)}&subject=${encodeURIComponent(subject)}`

);

const filtered =
await res.json();

console.log(
"Filtered:",
filtered
);

if(filtered.length === 0){

document.getElementById(
"teacherName"
).innerText =
"No Homework Found";

return;

}

const hw =
filtered[
filtered.length - 1
];

document.getElementById(
"teacherName"
).innerText =
hw.teacherName || "-";

document.getElementById(
"className"
).innerText =
hw.className || "-";

document.getElementById(
"homeworkSubject"
).innerText =
hw.subject || "-";

document.getElementById(
"homeworkText"
).innerText =
hw.homework || "-";

document.getElementById(
"subject"
).value =
hw.subject || "";

}

async function uploadHomework(){

console.log(
"studentName:",
localStorage.getItem(
"studentName"
)
);

const fd =
new FormData();

fd.append(
"file",
document.getElementById(
"file"
).files[0]
);

fd.append(
"studentName",
localStorage.getItem(
"studentName"
)
);

fd.append(
"studentId",
localStorage.getItem(
"studentId"
)
);

fd.append(
"className",
localStorage.getItem(
"className"
)
);

fd.append(
"subject",
document.getElementById(
"subject"
).value
);

const res =
await fetch(

"https://academy-backend-eatl.onrender.com/api/upload-homework",

{
method:"POST",
body:fd
}

);

await res.json();

alert(
"Uploaded"
);

}

loadHomeworkDetails();

</script>
