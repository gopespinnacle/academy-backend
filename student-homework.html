<h2>Upload Homework</h2>

<input id="subject">

<input
type="file"
id="file">

<button onclick="uploadHomework()">
Upload
</button>

<script>

async function uploadHomework(){

console.log(
"studentName:",
localStorage.getItem("studentName")
);

console.log(
"studentId:",
localStorage.getItem("studentId")
);

console.log(
"className:",
localStorage.getItem("className")
);

const fd =
new FormData();

fd.append(
"file",
document.getElementById("file").files[0]
);

fd.append(
"studentName",
prompt("Enter Student Name")
);

fd.append(
"studentId",
prompt("Enter Student ID")
);

fd.append(
"className",
prompt("Enter Class Name")
);

fd.append(
"subject",
document.getElementById(
"subject"
).value
);

const res =
await fetch(

"https://academy-backend-eatl.onrender.com/api/upload-homework",

{
method:"POST",

body:fd
}

);

const data =
await res.json();

alert(
"Uploaded"
);

}

</script>
