<h2 style="
display:flex;
justify-content:space-between;
align-items:center;
">

<span>Upload Homework</span>

<button onclick="
window.location.href='student-dashboard.html'
"
style="
background:#1e3a5f;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
">

← Back

</button>

</h2>

<table style="
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
margin-bottom:30px;
table-layout:fixed;
font-size:14px;
border:1px solid #d0d0d0;
">

<thead>

<tr style="
background:#1e3a5f;
color:white;
">

<th style="width:14%;border:1px solid #d0d0d0;padding:10px;">
Teacher
</th>

<th style="width:8%;border:1px solid #d0d0d0;padding:10px;">
Class
</th>

<th style="width:8%;border:1px solid #d0d0d0;padding:10px;">
Subject
</th>

<th style="width:24%;border:1px solid #d0d0d0;padding:10px;">
Homework Given
</th>

<th style="width:8%;border:1px solid #d0d0d0;padding:10px;">
Date
</th>

<th style="width:12%;border:1px solid #d0d0d0;padding:10px;">
Question Doc
</th>

<th style="width:16%;border:1px solid #d0d0d0;padding:10px;">
Choose File
</th>

<th style="width:10%;border:1px solid #d0d0d0;padding:10px;">
Upload
</th>

</tr>

</thead>

<tbody id="homeworkBody">

</tbody>

</table>
<script>

async function loadHomeworkDetails(){

const studentName =
localStorage.getItem(
"studentName"
);

console.log(
"studentName:",
studentName
);

if(!studentName){

alert(
"Student name not found. Login again."
);

window.location.href =
"student-login.html";

return;

}

const res =
await fetch(

"https://academy-backend-eatl.onrender.com/api/teacher-homeworks"

);

const allData =
await res.json();

console.log("ALL DATA");
console.log(allData);

const className =
localStorage.getItem(
"className"
) || "";

console.log(
"className:",
className
);

const data = allData.filter(x => {

    if (!x.students || !Array.isArray(x.students))
        return false;

    return x.students.some(student =>

        student.studentName &&
        student.studentName.trim().toLowerCase() ===
        studentName.trim().toLowerCase()

    );

});

console.log(
"Filtered:",
data
);

let html = "";

data.forEach((x,index)=>{

html += `

<tr
data-hw="${x.homeworkUniqueId || ''}"

style="
vertical-align:top;
"
>

<td style="
padding:10px;
border:1px solid #d0d0d0;
vertical-align:top;
">
${x.teacherName || "-"}
</td>

<td style="
padding:10px;
border:1px solid #d0d0d0;
vertical-align:top;
">
${x.className || "-"}
</td>

<td style="
padding:10px;
border:1px solid #d0d0d0;
vertical-align:top;
word-wrap:break-word;
overflow-wrap:break-word;
">
${x.subject || "-"}
</td>

<td style="
padding:10px;
border:1px solid #d0d0d0;
vertical-align:top;
word-wrap:break-word;
">
${x.homework || "-"}
</td>

<td style="
padding:10px;
border:1px solid #d0d0d0;
vertical-align:top;
">
${x.date || "-"}
</td>

<!-- Question Doc Column -->

<td style="
padding:10px;
border:1px solid #d0d0d0;
vertical-align:top;
">

${

x.questionDocs &&

x.questionDocs.length > 0

?

`

<b>

Question Files
(${x.questionDocs.length})

</b>

<br><br>

${

x.questionDocs.map(

(doc,index)=>`

<a

href="${doc.driveLink}"

target="_blank"

style="
display:block;
margin-bottom:5px;
background:#1e3a5f;
color:white;
padding:5px 10px;
border-radius:6px;
text-decoration:none;
width:120px;
text-align:center;
">

Question ${index+1}

</a>

`

).join("")

}

`

:

`

<span style="
color:red;
font-weight:bold;
">

No Question Doc

</span>

`

}

</td>

<!-- Choose File Column -->

<td style="
padding:10px;
border:1px solid #d0d0d0;
vertical-align:top;
">

<div
id="fileContainer${index}"
>

<input
type="file"
class="multiFile${index}"
>

</div>

<button
type="button"
onclick="addMoreFile(${index})"
style="
margin-top:5px;
background:#1e3a5f;
color:white;
border:none;
padding:5px 10px;
border-radius:6px;
cursor:pointer;
">

+ Add File

</button>

</td>

<td style="
padding:10px;
border:1px solid #d0d0d0;
vertical-align:top;
text-align:center;
">

<button
onclick="uploadHomework(
'${x.homeworkUniqueId}',
${index}
)"
style="
background:#1e3a5f;
color:white;
border:none;
padding:8px 15px;
border-radius:6px;
cursor:pointer;
">

Upload

</button>

</td>

</tr>

`;

});

document.getElementById(
"homeworkBody"
).innerHTML = html;

}

function addMoreFile(index){

const container =
document.getElementById(
"fileContainer" + index
);

const input =
document.createElement(
"input"
);

input.type = "file";

input.className =
"multiFile" + index;

input.style.marginTop =
"5px";

container.appendChild(
document.createElement("br")
);

container.appendChild(
input
);

}


async function uploadHomework(
homeworkUniqueId,
index
){

const allInputs =
document.querySelectorAll(
".multiFile" + index
);

const fd =
new FormData();

let hasFile = false;

allInputs.forEach(input=>{

if(input.files[0]){

fd.append(
"files",
input.files[0]
);

hasFile = true;

}

});

if(!hasFile){

alert(
"Choose atleast one file"
);

return;

}

fd.append(

"studentName",

localStorage.getItem(
"studentName"
)

);

fd.append(

"studentId",

localStorage.getItem(
"studentId"
)

);

fd.append(

"className",

localStorage.getItem(
"className"
)

);

const selectedHomework =
document.querySelectorAll(
"#homeworkBody tr"
)[index];

const subject =
selectedHomework.children[2]
.innerText;

fd.append(
"subject",
subject
);

fd.append(

"homeworkUniqueId",

homeworkUniqueId

);

const res =
await fetch(

"https://academy-backend-eatl.onrender.com/api/upload-homework",

{

method:"POST",

body:fd

}

);

const data =
await res.json();

if(data.success){

alert(
"Uploaded Successfully"
);

}else{

alert(
data.message ||
"Upload Failed"
);

}

}

loadHomeworkDetails();

</script>
