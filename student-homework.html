<h2>Upload Homework</h2>

<input id="subject">

<input
type="file"
id="file">

<button onclick="uploadHomework()">
Upload
</button>

<script>

async function uploadHomework(){

const fd =
new FormData();

fd.append(
"file",
document.getElementById("file").files[0]
);

fd.append(
"studentName",
localStorage.getItem(
"studentName"
)
);

fd.append(
"studentId",
localStorage.getItem(
"studentId"
)
);

fd.append(
"className",
localStorage.getItem(
"className"
)
);

fd.append(
"subject",
document.getElementById(
"subject"
).value
);

const res =
await fetch(

"https://academy-backend-eatl.onrender.com/api/upload-homework",

{
method:"POST",

body:fd
}

);

const data =
await res.json();

alert(
"Uploaded"
);

}

</script>
