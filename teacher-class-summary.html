<!DOCTYPE html>
<html>
<head>

<title>Teacher Class Summary</title>

<style>

body{
background:#f4f4f4;
padding:20px;
font-family:Arial;
}

</style>

</head>

<body>
<div id="summarySection" style="
display:none;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
margin-top:20px;
">

<h2>Class Summary</h2>

<div style="margin-bottom:15px;">
<label><b>Class Name</b></label>
<input type="text" id="summaryClass"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Date</b></label>
<input type="text" id="summaryDate"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Time</b></label>
<input type="text" id="summaryTime"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Subject</b></label>
<input type="text"
id="summarySubject"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Student</b></label>
<input type="text" id="summaryStudent"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Meeting In & Out Time</b></label>
<input type="text" id="summaryMeeting"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Today's Homework</b></label>

<textarea id="summaryHomework"
rows="6"
style="width:100%;padding:10px;"></textarea>
</div>

<button onclick="saveSummary()" style="
background:green;
color:white;
padding:12px 20px;
border:none;
border-radius:8px;
cursor:pointer;
">
Save Summary
</button>

</div>

<script>
async function checkSummaryMode(){

const params = new URLSearchParams(window.location.search);

const showSummary =
params.get("showSummary");

console.log(
"Local Grade:",
localStorage.getItem(
"className"
)
);

if(showSummary !== "true") return;

document.getElementById("summarySection")
.style.display = "block";

const studentName =
params.get("student") || "-";

document.getElementById(
"summaryStudent"
).value =
studentName;

const res =
await fetch(
"https://academy-backend-eatl.onrender.com/api/auth/students"
);

const students =
await res.json();

const foundStudent =
students.find(x =>

x.name
?.trim()
.toLowerCase()

===

studentName
.trim()
.toLowerCase()

);

document.getElementById(
"summaryClass"
).value =

foundStudent?.grade

||

params.get(
"className"
)

||

"-";

document.getElementById("summaryDate").value =
new Date().toLocaleDateString();

document.getElementById("summaryTime").value =
params.get("startTime") || "-";
document.getElementById(
"summarySubject"
).value =
params.get("subject") || "-";


const room = params.get("room");

const inTime =
localStorage.getItem(
"teacherInTime"
);

const outTime =
localStorage.getItem(
"teacherOutTime"
);

document.getElementById(
"summaryMeeting"
).value =

new Date(inTime)
.toLocaleTimeString()

+ " → " +

new Date(outTime)
.toLocaleTimeString();

}

async function saveSummary(){

const params = new URLSearchParams(window.location.search);

const response = await fetch(
"https://academy-backend-eatl.onrender.com/api/save-class-summary",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({

room: params.get("room"),

className:
document.getElementById("summaryClass").value,

periodTime:
document.getElementById("summaryTime").value,

subject:
document.getElementById(
"summarySubject"
).value,

studentName:
document.getElementById("summaryStudent").value,

teacherName:
localStorage.getItem(
"teacherName"
),

teacherInTime:
localStorage.getItem(
"teacherInTime"
),

teacherOutTime:
localStorage.getItem(
"teacherOutTime"
),

homework:
document.getElementById("summaryHomework").value

})
});

const data = await response.json();

if(data.success){

alert("✅ Summary Saved");

window.location.href =
"teacher-dashboard.html";

}else{

alert("❌ Save Failed");

}

}
window.onload=function(){

checkSummaryMode();

}
</script>

</body>
</html>
