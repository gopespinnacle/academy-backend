<!DOCTYPE html>
<html>
<head>

<title>Teacher Class Summary</title>

<style>

body{
background:#f4f4f4;
padding:20px;
font-family:Arial;
}

</style>

</head>

<body>
<div id="summarySection" style="
display:none;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
margin-top:20px;
">

<h2>Class Summary</h2>

<div style="margin-bottom:15px;">
<label><b>Class Name</b></label>
<input type="text" id="summaryClass"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Date</b></label>
<input type="text" id="summaryDate"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Time</b></label>
<input type="text" id="summaryTime"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Subject</b></label>
<input type="text"
id="summarySubject"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Student</b></label>
<div id="summaryStudent"
style="
width:100%;
padding:10px;
border:1px solid #ccc;
background:#fff;
min-height:60px;
">
</div>
</div>

<div style="margin-bottom:15px;">
<label><b>Meeting In & Out Time</b></label>
<input type="text" id="summaryMeeting"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Today's Homework</b></label>

<textarea id="summaryHomework"
rows="6"
style="width:100%;padding:10px;"></textarea>
</div>

<button onclick="saveSummary()" style="
background:green;
color:white;
padding:12px 20px;
border:none;
border-radius:8px;
cursor:pointer;
">
Save Summary
</button>

</div>

<script>


const token = sessionStorage.getItem("token");
const role = sessionStorage.getItem("role");

if (!token || role !== "teacher") {
    alert("Please login first");
    window.location.href = "teacher-login.html";
}
function checkSummaryMode(){

    document.getElementById("summarySection").style.display = "block";

    document.getElementById("summaryClass").value =
        sessionStorage.getItem("summaryClassName") || "";

    document.getElementById("summaryDate").value =
        sessionStorage.getItem("summaryDate") || "";

    document.getElementById("summaryTime").value =
        sessionStorage.getItem("summaryPeriodTime") || "";

    document.getElementById("summarySubject").value =
        sessionStorage.getItem("summarySubject") || "";

    const studentBox =
        document.getElementById("summaryStudent");

    studentBox.innerHTML = "";

    const students =
        JSON.parse(
            sessionStorage.getItem("summaryStudents") || "[]"
        );

    students.forEach((student,index)=>{

    studentBox.innerHTML += `
        <div style="
        border:1px solid #ccc;
        border-radius:8px;
        padding:10px;
        margin-bottom:10px;
        background:#fafafa;
        ">
            <b>Student ${index+1}</b><br>
            ${student.studentName}
        </div>
    `;

});

    const inTime =
        sessionStorage.getItem("teacherInTime");

    const outTime =
        sessionStorage.getItem("teacherOutTime");

    if(inTime && outTime){

        document.getElementById("summaryMeeting").value =
            new Date(inTime).toLocaleTimeString()
            +
            " → "
            +
            new Date(outTime).toLocaleTimeString();

    }

}

async function saveSummary(){

const params = new URLSearchParams(window.location.search);

const response = await fetch(
"https://academy-backend-eatl.onrender.com/api/save-class-summary",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({

room: params.get("room"),

className:
document.getElementById("summaryClass").value,

periodTime:
document.getElementById("summaryTime").value,

subject:
document.getElementById(
"summarySubject"
).value,

date:
document.getElementById("summaryDate").value,

day:
sessionStorage.getItem("summaryDay"),

periodStart:
sessionStorage.getItem("summaryStartTime"),

periodEnd:
sessionStorage.getItem("summaryEndTime"),

students:
JSON.parse(
    sessionStorage.getItem("summaryStudents") || "[]"
),

sessionId:
sessionStorage.getItem("classSessionId"),

teacherName:
sessionStorage.getItem(
"teacherName"
),

teacherId:
sessionStorage.getItem(
"teacherId"
),



teacherInTime:
sessionStorage.getItem(
"teacherInTime"
),

teacherOutTime:
sessionStorage.getItem(
"teacherOutTime"
),

homework:
document.getElementById("summaryHomework").value

})
});

const data = await response.json();

if(data.success){

alert("✅ Summary Saved");

window.location.href =
"teacher-dashboard.html";

}else{

alert("❌ Save Failed");

}

}
window.onload=function(){

checkSummaryMode();

}
</script>

</body>
</html>
