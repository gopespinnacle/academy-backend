<!DOCTYPE html>
<html>
<head>

<title>Teacher Class Summary</title>

<style>

body{
background:#f4f4f4;
padding:20px;
font-family:Arial;
}

</style>

</head>

<body>
<div id="summarySection" style="
display:none;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
margin-top:20px;
">

<h2>Class Summary</h2>

<div style="margin-bottom:15px;">
<label><b>Class Name</b></label>
<input type="text" id="summaryClass"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Date</b></label>
<input type="text" id="summaryDate"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Time</b></label>
<input type="text" id="summaryTime"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Subject</b></label>
<input type="text"
id="summarySubject"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Student</b></label>
<div id="summaryStudent"
style="
width:100%;
padding:10px;
border:1px solid #ccc;
background:#fff;
min-height:60px;
">
</div>
</div>

<div style="margin-bottom:15px;">
<label><b>Meeting In & Out Time</b></label>
<input type="text" id="summaryMeeting"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Today's Homework</b></label>

<textarea id="summaryHomework"
rows="6"
style="width:100%;padding:10px;"></textarea>
</div>

<button onclick="saveSummary()" style="
background:green;
color:white;
padding:12px 20px;
border:none;
border-radius:8px;
cursor:pointer;
">
Save Summary
</button>

</div>

<script>


const token = sessionStorage.getItem("token");
const role = sessionStorage.getItem("role");

if (!token || role !== "teacher") {
    alert("Please login first");
    window.location.href = "teacher-login.html";
}
async function checkSummaryMode(){

const params = new URLSearchParams(window.location.search);

const showSummary =
params.get("showSummary");

console.log(
"Local Grade:",
sessionStorage.getItem(
"className"
)
);

if(showSummary !== "true") return;

document.getElementById("summarySection")
.style.display = "block";

const studentBox =
document.getElementById("summaryStudent");

studentBox.innerHTML = "";

const students = JSON.parse(
decodeURIComponent(
params.get("students")
));

studentBox.innerHTML = "";

students.forEach((name,index)=>{

    studentBox.innerHTML += `
    <div style="
        border:1px solid #ccc;
        border-radius:8px;
        padding:10px;
        margin-bottom:10px;
        background:#fafafa;
    ">
        <b>Student ${index+1}</b><br>
        ${name}
    </div>
    `;

});

const foundStudent =
students.find(x =>

x.name
?.trim()
.toLowerCase()

===

studentName
.trim()
.toLowerCase()

);

document.getElementById(
"summaryClass"
).value =

foundStudent?.grade

||

params.get(
"className"
)

||

"-";

document.getElementById("summaryDate").value =
new Date().toLocaleDateString();

document.getElementById("summaryTime").value =
params.get("startTime") || "-";
document.getElementById(
"summarySubject"
).value =
params.get("subject") || "-";


const room = params.get("room");

const inTime =
sessionStorage.getItem(
"teacherInTime"
);

const outTime =
sessionStorage.getItem(
"teacherOutTime"
);

document.getElementById(
"summaryMeeting"
).value =

new Date(inTime)
.toLocaleTimeString()

+ " → " +

new Date(outTime)
.toLocaleTimeString();

}

async function saveSummary(){

const params = new URLSearchParams(window.location.search);

const response = await fetch(
"https://academy-backend-eatl.onrender.com/api/save-class-summary",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({

room: params.get("room"),

className:
document.getElementById("summaryClass").value,

periodTime:
document.getElementById("summaryTime").value,

subject:
document.getElementById(
"summarySubject"
).value,

studentId:
sessionStorage.getItem(
"studentId"
),

teacherId:
sessionStorage.getItem(
"teacherId"
),

homeworkUniqueId:

sessionStorage.getItem(
"studentId"
)

+

"_"

+

sessionStorage.getItem(
"teacherId"
)

+

"_"

+

document.getElementById(
"summarySubject"
).value

+

"_"

+

document.getElementById(
"summaryTime"
).value
.replace(":","")

+

"_"

+

new Date()
.toLocaleDateString("en-GB")
.replaceAll("/",""),

studentName:
document.getElementById("summaryStudent").value,

teacherName:
sessionStorage.getItem(
"teacherName"
),

teacherId:
sessionStorage.getItem(
"teacherId"
),

homeworkUniqueId:

document.getElementById(
"summaryStudent"
).value

+

"_"

+

sessionStorage.getItem("teacherId")

+

"_"

+

document.getElementById(
"summarySubject"
).value

+

"_"

+

document.getElementById(
"summaryTime"
).value
.replace(":","")

+

"_"

+

document.getElementById(
"summaryDate"
).value
.split("/")
.join(""),

teacherInTime:
sessionStorage.getItem(
"teacherInTime"
),

teacherOutTime:
sessionStorage.getItem(
"teacherOutTime"
),

homework:
document.getElementById("summaryHomework").value

})
});

const data = await response.json();

if(data.success){

alert("✅ Summary Saved");

window.location.href =
"teacher-dashboard.html";

}else{

alert("❌ Save Failed");

}

}
window.onload=function(){

checkSummaryMode();

}
</script>

</body>
</html>
