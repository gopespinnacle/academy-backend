<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Gopes Pinnacle Secure Viewer</title>

<link rel="stylesheet" href="chapter-viewer.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

</head>

<body>

<!-- Loading -->

<div id="loadingScreen">

<div class="loader"></div>

<div class="loadingText">

Loading Secure Viewer...

</div>

</div>

<!-- Header -->

<header id="topHeader">

<div id="academyName">

GOPES PINNACLE ACADEMY

</div>

<div id="chapterDetails">

<div>

<b>Subject :</b>

<span id="subjectName">

Loading...

</span>

</div>

<div>

<b>Teacher :</b>

<span id="teacherName">

Loading...

</span>

</div>

<div>

<b>Class :</b>

<span id="className">

Loading...

</span>

</div>

<div>

<b>Chapter :</b>

<span id="chapterName">

Loading...

</span>

</div>

<div>

<b>Topic :</b>

<span id="topicName">

Loading...

</span>

</div>

</div>

</header>

<!-- Toolbar -->

<div id="toolbar">

<button id="prevPage">

◀ Previous

</button>

<div>

Page

<span id="currentPage">

1

</span>

/

<span id="totalPages">

1

</span>

</div>

<button id="nextPage">

Next ▶

</button>

<div class="separator"></div>

<button id="zoomOut">

－

</button>

<span id="zoomLevel">

100%

</span>

<button id="zoomIn">

＋

</button>

<div class="separator"></div>

<button id="fullscreenBtn">

Fullscreen

</button>

</div>

<!-- Viewer -->

<div id="viewerContainer">

<div id="gridOverlay"></div>

<div id="rgbOverlay"></div>

<div id="watermarkLayer"></div>

<div id="pdfContainer"></div>

</div>

<script src="chapter-viewer.js"></script>

</body>

</html>
