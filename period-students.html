<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Period Students</title>

<link rel="stylesheet" href="style.css">

<style>

#mobileHeading{
display:none;
}

@media(max-width:768px){

#desktopHeading{
display:none;

padding:20px;
}

padding:12px;
margin-bottom:10px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
font-size:14px;
}

.mobile-header{

display:none;

}

@media(max-width:768px){

.mobile-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:15px;

}

.page-title{

margin:0;

font-size:20px;

text-align:center;

flex:1;

}

.back-btn,
.home-btn{

all:unset;

font-size:24px;

cursor:pointer;

padding:5px;

}

@media(max-width:768px){

#sidebar-container{
display:none !important;
}

#attendanceTable{

}

padding:0;
margin:0;
}

.main-content{
margin:0 !important;
padding:15px !important;
width:100% !important;
max-width:100% !important;
box-sizing:border-box;
}

#assignedContainer{
display:none;
}

#mobileAttendanceCards{
display:block;
width:100%;
}

h3{
display:none;
}

}

.attend-mobile-btn{
width:100%;
background:#28a745;
color:white;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
margin-bottom:15px;
}

</style>
</head>

<body class="dashboard-page">

<!-- SIDEBAR -->
<div id="sidebar-container"></div>

<script>

if(window.innerWidth > 768){

fetch("teacher-sidebar.html")
.then(res => res.text())
.then(data=>{

document.getElementById("sidebar-container").innerHTML = data;

});

}

</script>

<div class="main-content">

<div class="mobile-header">



<button
class="back-btn"
onclick="history.back()">
←
</button>

<h2 class="page-title">
Assigned Students
</h2>

<button
class="home-btn"
onclick="window.location.href='teacher-dashboard.html'">
🏠
</button>

</div>

<h2 id="desktopHeading">

Assigned Students (This Period)

</h2>

<button
id="attendBtn"
class="attend-mobile-btn"
onclick="joinClass()"
disabled>
⏳ Available 10 min before
</button>



<h2 id="desktopAttendanceHeading">
Class Attendance
</h2>

<div id="assignedContainer"></div>

<div id="mobileAttendanceCards"></div>
<!-- ✅ PASTE HERE -->


<table id="attendanceTable" style="
width:100%;
border-collapse:collapse;
background:#fff;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
">

<thead style="background:#f1f1f1;">
<tr>
    <th>Date</th>
<th style="padding:10px;">Student</th>
<th>Student Status</th>
<th>Late Join</th>
<th>Teacher Status</th>
<th>Teacher Late</th>
<th>Compensation (mins)</th>
</tr>
</thead>

<tbody id="attendanceBody"></tbody>

</table>
<hr style="margin:40px 0;">

<div id="summarySection" style="
display:none;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
margin-top:20px;
">

<h2>Class Summary</h2>

<div style="margin-bottom:15px;">
<label><b>Class Name</b></label>
<input type="text" id="summaryClass"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Date</b></label>
<input type="text" id="summaryDate"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Time</b></label>
<input type="text" id="summaryTime"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Student</b></label>
<input type="text" id="summaryStudent"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Meeting In & Out Time</b></label>
<input type="text" id="summaryMeeting"
readonly
style="width:100%;padding:10px;">
</div>

<div style="margin-bottom:15px;">
<label><b>Today's Homework</b></label>

<textarea id="summaryHomework"
rows="6"
style="width:100%;padding:10px;"></textarea>
</div>

<button onclick="saveSummary()" style="
background:green;
color:white;
padding:12px 20px;
border:none;
border-radius:8px;
cursor:pointer;
">
Save Summary
</button>

</div>
</div>

<script>

const token = sessionStorage.getItem("token");
let attendanceMarked = false; 
/* GET URL PARAMS */
const params = new URLSearchParams(window.location.search);

/* CLEAN PARAMS */
const cleanedParams = new URLSearchParams();

cleanedParams.append("className", params.get("className")?.trim());
cleanedParams.append("day", params.get("day")?.trim());
cleanedParams.append("startTime", params.get("startTime")?.trim());

const subject = params.get("subject");
const language = params.get("language");
const eca = params.get("eca");

if(subject){
cleanedParams.append("subject", subject.trim());
}

if(language){
cleanedParams.append("language", language.trim());
}

if(eca){
cleanedParams.append("eca", eca.trim());
}

/* LOAD STUDENTS */
async function loadPeriodStudents(){
console.log("TOKEN:", token);
try{
console.log("API URL:", cleanedParams.toString());
const res = await fetch(
"https://academy-backend-eatl.onrender.com/api/teacher/period-students?" + cleanedParams.toString(),
{
headers:{
"Authorization":"Bearer " + token
}
}
);

const data = await res.json();
console.log("Response:", data);
const container = document.getElementById("assignedContainer");
container.innerHTML = "";

/* NO DATA */
if(!data.data || data.data.length === 0){
container.innerHTML = "<p>No students found ❌</p>";
return;
}

/* DISPLAY */
data.data.forEach(d=>{

let label =
d.subject ||
(d.languages?.join(", ")) ||
(d.eca?.join(", ")) ||
"General";

container.innerHTML += `
<div class="student-card">
<b>👤 ${d.student.name}</b><br>
📘 ${label}
</div>
`;

});
renderAttendanceTable(data.data);
updateTeacherStatus(); 
}catch(err){

console.log("FULL ERROR:", err);   // ✅ better debug

document.getElementById("assignedContainer").innerHTML =
"<p style='color:red;'>API ERROR - Check Console</p>";

}

}


window.onload = function(){

loadPeriodStudents();

checkClassTime();

checkSummaryMode();

};

/* 🔥 TIME CONTROL FUNCTION */
function checkClassTime(){

const params = new URLSearchParams(window.location.search);
const startTime = params.get("startTime");

if(!startTime) return;

const now = new Date();

const [hour, minute] = startTime.split(":");

const classTime = new Date();
classTime.setHours(parseInt(hour));
classTime.setMinutes(parseInt(minute));
classTime.setSeconds(0);

// 10 minutes before
const enableTime = new Date(classTime.getTime() - 10 * 60000);

const btn = document.getElementById("attendBtn");

if(now >= enableTime){
btn.disabled = false;
btn.style.background = "#28a745";
btn.innerText = "🎥 Attend Class";
}else{
btn.disabled = true;
btn.style.background = "gray";
btn.innerText = "⏳ Available 10 min before";
}

}
function updateTeacherStatus(){

const params = new URLSearchParams(window.location.search);
const startTime = params.get("startTime");

if(!startTime) return;

const now = new Date();

const [hour, minute] = startTime.split(":");

const classStart = new Date();
classStart.setHours(parseInt(hour));
classStart.setMinutes(parseInt(minute));
classStart.setSeconds(0);

// class end = +1 hour
const endTime = params.get("endTime");

if(!endTime) return;  // safety

const [endHour, endMinute] = endTime.split(":");

const classEnd = new Date();
classEnd.setHours(parseInt(endHour));
classEnd.setMinutes(parseInt(endMinute));
classEnd.setSeconds(0);

const teacherStatusElements = document.querySelectorAll("[id^='teacher-status-']");

teacherStatusElements.forEach(el => {

// BEFORE CLASS
// BEFORE CLASS
if(now < classStart){
el.innerHTML = "<span style='color:gray;'>Class yet to start</span>";
}

const studentId =
el.id.replace("teacher-status-","");

const mobileEl =
document.getElementById(
`mobile-teacher-status-${studentId}`
);

if(mobileEl){
mobileEl.innerHTML =
"Class yet to start";
mobileEl.style.color = "gray";
}

// DURING CLASS (NOT JOINED)
else if(now >= classStart && now <= classEnd){

if(el.innerText !== "Present"){

el.innerHTML =
"<span style='color:orange;'>Teacher not yet came</span>";

const studentId =
el.id.replace("teacher-status-","");

const mobileEl =
document.getElementById(
`mobile-teacher-status-${studentId}`
);

if(mobileEl){
mobileEl.innerHTML =
"Teacher not yet came";
mobileEl.style.color = "orange";
}

}

}

// AFTER CLASS (NOT CLICKED)
else if(now > classEnd){

if(!attendanceMarked && el.innerText !== "Present" && el.innerText !== "Absent"){

el.innerHTML = "<span style='color:red;'>Absent</span>";

const studentId =
el.id.replace("teacher-status-","");

const mobileEl =
document.getElementById(
`mobile-teacher-status-${studentId}`
);

if(mobileEl){
mobileEl.innerHTML = "Absent";
mobileEl.style.color = "red";
}

/* ✅ SAVE ABSENT IN DB */
fetch("https://academy-backend-eatl.onrender.com/api/teacher/attendance",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer " + token
},
body: JSON.stringify({
teacherId: sessionStorage.getItem("teacherId"),
teacherName: sessionStorage.getItem("teacherName"),
className: params.get("className"),
subject: params.get("subject") || "General",
day: params.get("day"),
startTime: params.get("startTime"),
date: new Date().toISOString(),
joinTime: null,
endTime: null,
status: "Absent"
})
});

// ✅ ADD THIS LINE HERE (OUTSIDE fetch)
attendanceMarked = true;

}

}

});

}
/* RUN EVERY 10 SECONDS */
setInterval(() => {
checkClassTime();
updateTeacherStatus();
}, 10000);
function renderAttendanceTable(students){

const tbody = document.getElementById("attendanceBody");
tbody.innerHTML = "";

const mobileCards =
document.getElementById("mobileAttendanceCards");

if(mobileCards){
mobileCards.innerHTML = "";
}

students.forEach(s => {

const today = new Date().toLocaleDateString("en-IN");

tbody.innerHTML += `
<tr>

<td>${today}</td>

<td style="padding:10px;">${s.student.name}</td>

<td id="status-${s.student._id}">
<span style="color:gray;">Pending</span>
</td>

<td id="late-${s.student._id}">0</td>

<td id="teacher-status-${s.student._id}">
<span style="color:gray;">Class yet to start</span>
</td>

<td>0</td>

<td>0</td>

</tr>
`;

if(window.innerWidth <= 768){

mobileCards.innerHTML += `

<div style="
background:white;
padding:15px;
border-radius:12px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
">

<b>👤 ${s.student.name}</b><br>

📘 ${params.get("subject") || "General"}<br><br>

📅 ${today}<br>

🟡 Student Status : Pending<br>

⏰ Late Join : 0 min<br><br>

👨‍🏫 Teacher Status :
<span
id="mobile-teacher-status-${s.student._id}"
style="color:gray;">
Class yet to start
</span><br>

⌛ Teacher Late : 0 min<br>

🎁 Compensation : 0 min

</div>

`;

}


});

}
async function joinClass(){
console.log("Attendance Marked ✅");
const params = new URLSearchParams(window.location.search);
const startTime = params.get("startTime");

const now = new Date();
const [hour, minute] = startTime.split(":");

const classStart = new Date();
classStart.setHours(parseInt(hour));
classStart.setMinutes(parseInt(minute));
classStart.setSeconds(0);

if(now < classStart){
alert("Class not started yet ❌");
return;
}

/* ✅ SET PRESENT */
document.querySelectorAll(
"[id^='teacher-status-']"
).forEach(el=>{

el.innerHTML =
"<span style='color:green;'>Present</span>";

const studentId =
el.id.replace("teacher-status-","");

const mobileEl =
document.getElementById(
`mobile-teacher-status-${studentId}`
);

if(mobileEl){
mobileEl.innerHTML = "Present";
mobileEl.style.color = "green";
}

});

const className = params.get("className");
const day = params.get("day");

const subject =
params.get("subject") ||
params.get("language") ||
params.get("eca") ||
"General";

const token = sessionStorage.getItem("token");
const teacherId = sessionStorage.getItem("teacherId");

/* API */
try{
await fetch("https://academy-backend-eatl.onrender.com/api/teacher/attendance",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer " + token
},
body: JSON.stringify({
teacherId,
className,
subject,
day,
startTime,   
date: new Date().toISOString(),

joinTime: new Date().toISOString(),  
endTime: null,                        

status: "Present"
})
});

console.log("Attendance Marked ✅");

}catch(err){
console.log("Attendance Error ❌", err);
}

/* ================= OPEN GOOGLE MEET ================= */

const meetingLink = sessionStorage.getItem("meetingLink");

if(!meetingLink){
    alert("Google Meet link not found.");
    return;
}

// Open Google Meet
window.open(meetingLink, "_blank");

attendanceMarked = true;
}
async function endClass(){

const params = new URLSearchParams(window.location.search);

const token = sessionStorage.getItem("token");

await fetch("https://academy-backend-eatl.onrender.com/api/teacher/end-attendance",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer " + token
},
body: JSON.stringify({
teacherId: sessionStorage.getItem("teacherId"),
className: params.get("className"),
day: params.get("day"),
startTime: params.get("startTime"),
endTime: new Date().toISOString()
})
});

alert("Class Ended ✅");

}

async function testSaveAttendance(){

const params = new URLSearchParams(window.location.search);

await fetch("https://academy-backend-eatl.onrender.com/api/teacher/attendance",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer " + token
},
body: JSON.stringify({
teacherId: sessionStorage.getItem("teacherId"),
teacherName: sessionStorage.getItem("teacherName"),
className: params.get("className"),
subject: params.get("subject") || "General",
day: params.get("day"),
startTime: params.get("startTime"),
date: new Date().toISOString(),
joinTime: null,
endTime: null,
status: "Absent"
})
});

alert("Saved in DB ✅");

}

async function checkSummaryMode(){

const params = new URLSearchParams(window.location.search);

const showSummary =
params.get("showSummary");

if(showSummary !== "true") return;

document.getElementById("summarySection")
.style.display = "block";

const studentName =
params.get(
"student"
);

const res =
await fetch(
"https://academy-backend-eatl.onrender.com/api/students"
);

const students =
await res.json();

const foundStudent =
students.find(x =>

(
x.studentName ||
x.name
)

?.trim()
.toLowerCase()

===

studentName
.trim()
.toLowerCase()

);

console.log(
"Found Student:",
foundStudent
);

document.getElementById(
"summaryClass"
).value =

foundStudent?.grade

||

foundStudent?.className

||

params.get(
"className"
)

||

"-";

document.getElementById("summaryDate").value =
new Date().toLocaleDateString();

document.getElementById("summaryTime").value =
params.get("startTime") || "-";

document.getElementById("summaryStudent").value =
params.get("student") || "-";

const room = params.get("room");

const response = await fetch(
"https://academy-backend-eatl.onrender.com/api/get-meeting-time?room=" + room
);

const data = await response.json();

document.getElementById("summaryMeeting").value =
data.inTime + " → " +
new Date(params.get("outTime"))
.toLocaleTimeString();

}

async function saveSummary(){

const params = new URLSearchParams(window.location.search);

const response = await fetch(
"https://academy-backend-eatl.onrender.com/api/save-class-summary",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({

room: params.get("room"),

className:
document.getElementById("summaryClass").value,

periodTime:
document.getElementById("summaryTime").value,

studentName:
document.getElementById("summaryStudent").value,

teacherName:
params.get("teacher"),

homework:
document.getElementById("summaryHomework").value

})
});

const data = await response.json();

if(data.success){

alert("✅ Summary Saved");

window.location.href =
"teacher-periods.html";

}else{

alert("❌ Save Failed");

}

}
</script>

</body>
</html>
