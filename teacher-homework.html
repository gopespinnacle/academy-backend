<h2 style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
">

<span>Student Homework</span>

<button onclick="
window.location.href='teacher-dashboard.html'
"
style="
background:#1e3a5f;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
">
← Back
</button>

</h2>

<div style="
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
margin-bottom:20px;
">

<label><b>Filter Date :</b></label>

<input
type="date"
id="filterDate"
onchange="load()"
style="
padding:8px;
margin-left:10px;
">

</div>

<table
style="
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
table-layout:fixed;
">

<thead>

<tr style="
background:#1e3a5f;
color:white;
">

<th style="width:12%;">
Student
</th>

<th style="width:8%;">
Class
</th>

<th style="width:8%;">
Subject
</th>

<th style="width:28%;">
Homework Given
</th>

<th style="width:16%;">
Question Doc
</th>

<th style="width:18%;">
File
</th>

<th style="width:10%;">
Date
</th>

</tr>

</thead>

<tbody id="body">

</tbody>

</table>

<script>

async function load(){

const filterDate =
document.getElementById(
"filterDate"
).value;

const teacherName =
localStorage.getItem(
"teacherName"
);

const res =
await fetch(

"https://academy-backend-eatl.onrender.com/api/teacher-homeworks?teacherName="

+

encodeURIComponent(
teacherName
)

);

const data =
await res.json();

let html = "";

data.forEach(x=>{

if(
filterDate &&
x.date !== filterDate
){
return;
}

html += `

<tr style="
vertical-align:top;
">

<td style="
padding:10px;
word-wrap:break-word;
">
${x.studentName || "-"}
</td>

<td>
${x.className || "-"}
</td>

<td>
${x.subject || "-"}
</td>

<td>
${x.homework || "-"}
</td>

<!-- Question Doc Column -->

<td>

${

x.questionDocs &&

x.questionDocs.length > 0

?

`

<b>

Question Files
(${x.questionDocs.length})

</b>

<br><br>

${

x.questionDocs.map(

(doc,index)=>`

<a

href="${doc.driveLink}"

target="_blank"

style="
display:block;
margin-bottom:5px;
background:#1e3a5f;
color:white;
padding:6px 10px;
border-radius:6px;
text-decoration:none;
width:120px;
text-align:center;
">

Question ${index+1}

</a>

`

).join("")

}

`

:

`

<span style="
color:red;
font-weight:bold;
">

No Question Doc

</span>

`

}

</td>

<!-- Existing Student File Column -->

<td>

${

x.homeworkStatus === "Submitted"

&&

x.files

&&

x.files.length > 0

?

`

<div>

<b>

Files (${x.files.length})

</b>

<br><br>

${

x.files.map(

(file,i)=>`

<a

href="${file.driveLink}"

target="_blank"

style="
display:block;
margin-bottom:5px;
background:#1e3a5f;
color:white;
padding:6px 10px;
border-radius:6px;
text-decoration:none;
width:120px;
text-align:center;
">

Download ${i+1}

</a>

`

).join("")

}

</div>

`

:

`

<span style="
color:red;
font-weight:bold;
">

Not Submitted

</span>

`

}

</td>

<td>
${x.date || "-"}
</td>

</tr>

`;

});

document
.getElementById("body")
.innerHTML = html;

}

load();

</script>
