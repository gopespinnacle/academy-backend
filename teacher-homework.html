<h2 style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
">

<span>Student Homework</span>

<button onclick="
window.location.href='teacher-dashboard.html'
"
style="
background:#1e3a5f;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
">
← Back
</button>

</h2>

<div style="
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
margin-bottom:20px;
">

<label><b>Filter Date :</b></label>

<input
type="date"
id="filterDate"
onchange="load()"
style="
padding:8px;
margin-left:10px;
">

</div>

<table
style="
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
table-layout:fixed;
border:1px solid #d0d0d0;
font-size:14px;
">

<thead>

<tr style="
background:#1e3a5f;
color:white;
">

<th style="width:12%;border:1px solid #d0d0d0;padding:10px;">
Student
</th>

<th style="width:8%;border:1px solid #d0d0d0;padding:10px;">
Class
</th>

<th style="width:8%;border:1px solid #d0d0d0;padding:10px;">
Subject
</th>

<th style="width:25%;border:1px solid #d0d0d0;padding:10px;">
Homework Given
</th>

<th style="width:20%;border:1px solid #d0d0d0;padding:10px;">
Question Doc
</th>

<th style="width:17%;border:1px solid #d0d0d0;padding:10px;">
File
</th>

<th style="width:10%;border:1px solid #d0d0d0;padding:10px;">
Date
</th>

</tr>

</thead>

<tbody id="body">

</tbody>

</table>

<script>

async function load(){

const filterDate =
document.getElementById(
"filterDate"
).value;

const teacherName =
sessionStorage.getItem(
"teacherName"
);

if(!teacherName){

alert("Please login first");

window.location.href =
"teacher-login.html";

return;

}

const res =
await fetch(

"https://academy-backend-eatl.onrender.com/api/teacher-homeworks?teacherName="

+

encodeURIComponent(
teacherName
)

);

const data =
await res.json();

let html = "";

data.forEach(x=>{

if(
filterDate &&
x.date !== filterDate
){
return;
}

html += `

<tr style="
vertical-align:top;
border-bottom:1px solid #d0d0d0;
">

<td style="
padding:10px;
border:1px solid #d0d0d0;
vertical-align:top;
word-wrap:break-word;
">
${x.studentName || "-"}
</td>

<td style="
padding:10px;
border:1px solid #d0d0d0;
vertical-align:top;
word-wrap:break-word;
overflow-wrap:break-word;
">
${x.className || "-"}
</td>

<td style="
padding:10px;
border:1px solid #d0d0d0;
vertical-align:top;
word-wrap:break-word;
">
${x.subject || "-"}
</td>

<td style="
padding:10px;
border:1px solid #d0d0d0;
vertical-align:top;
word-wrap:break-word;
overflow-wrap:break-word;
">
${x.homework || "-"}
</td>

<!-- Question Doc Column -->

<td style="
padding:10px;
border:1px solid #d0d0d0;
vertical-align:top;
">

<div id="questionFiles${x.summaryId}">

<input
type="file"
name="questionFile${x.summaryId}"
>

</div>

<button
onclick="addQuestionFile('${x.summaryId}')"
style="
margin-top:5px;
background:#1e3a5f;
color:white;
border:none;
padding:4px 8px;
border-radius:5px;
cursor:pointer;
">

+ Add File

</button>

<br><br>

<button
onclick="uploadQuestionDocs(
'${x.summaryId}'
)"
style="
background:green;
color:white;
border:none;
padding:6px 12px;
border-radius:5px;
cursor:pointer;
">

Upload

</button>

<br><br>

${

x.questionDocs &&

x.questionDocs.length > 0

?

`

<b>

Question Files
(${x.questionDocs.length})

</b>

<br><br>

${

x.questionDocs.map(

(doc,index)=>`

<a

href="${doc.s3Url}"

target="_blank"

style="
display:block;
margin-bottom:5px;
background:#1e3a5f;
color:white;
padding:6px 10px;
border-radius:6px;
text-decoration:none;
width:120px;
text-align:center;
">

Question ${index+1}

</a>

`

).join("")

}

`

:

`

<span style="
color:red;
font-weight:bold;
">

No Question Doc

</span>

`

}

</td>

<!-- Existing Student File Column -->

<td style="
padding:10px;
border:1px solid #d0d0d0;
vertical-align:top;
text-align:center;
">

${

x.files &&

x.files.length > 0

?

`

${

x.files.map(upload => `

<div style="
border:1px solid #ddd;
padding:8px;
margin-bottom:10px;
border-radius:6px;
">

<b>${upload.studentName}</b>

<br><br>

${

upload.files.map((file,i)=>`

<a

href="${file.s3Url}"

target="_blank"

style="
display:block;
margin-bottom:5px;
background:#1e3a5f;
color:white;
padding:6px 10px;
border-radius:6px;
text-decoration:none;
width:120px;
text-align:center;
">

Download ${i+1}

</a>

`).join("")

}

</div>

`).join("")

}

`

:

`

<span style="
color:red;
font-weight:bold;
">

No Student Submission

</span>

`

}

</td>

<td style="
padding:10px;
border:1px solid #d0d0d0;
vertical-align:top;
text-align:center;
">
${x.date || "-"}
</td>

</tr>

`;

});

document
.getElementById("body")
.innerHTML = html;

}

load();

function addQuestionFile(summaryId){

const container =

document.getElementById(
"questionFiles" + summaryId
);

const input =
document.createElement(
"input"
);

input.type = "file";

input.name =
"questionFile" + summaryId;

input.style.display =
"block";

input.style.marginTop =
"5px";

container.appendChild(
input
);

}

async function uploadQuestionDocs(
summaryId
){

const inputs =

document.querySelectorAll(

`#questionFiles${summaryId} input`

);

const fd =
new FormData();

inputs.forEach(input=>{

if(
input.files[0]
){

fd.append(
"files",
input.files[0]
);

}

});

fd.append(
"summaryId",
summaryId
);

const res =
await fetch(

"https://academy-backend-eatl.onrender.com/api/upload-question-docs",

{

method:"POST",

body:fd

}

);

const data =
await res.json();

if(data.success){

alert(
"Question Docs Uploaded"
);

load();

}else{

alert(
data.message
);

}

}

</script>
