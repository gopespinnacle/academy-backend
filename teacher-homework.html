<h2>Student Homework</h2>

<table border="1">

<thead>

<tr>

<th>Student</th>

<th>Class</th>

<th>Subject</th>

<th>File</th>

</tr>

</thead>

<tbody id="body">

</tbody>

</table>

<script>

async function load(){

const res =
await fetch(

"https://academy-backend-eatl.onrender.com/api/teacher-homeworks"
);

const data =
await res.json();

let html="";

data.forEach(x=>{

html += `

<tr>

<td>${x.studentName}</td>

<td>${x.className}</td>

<td>${x.subject}</td>

<td>

<a
href="${x.driveLink}"
target="_blank">

Download

</a>

</td>

</tr>

`;

});

document
.getElementById("body")
.innerHTML=html;

}

load();

</script>
