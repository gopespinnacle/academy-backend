<h2 style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
">

<span>Student Homework</span>

<button onclick="
window.location.href='teacher-dashboard.html'
"
style="
background:#1e3a5f;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
">
← Back
</button>

</h2>

<div style="
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
margin-bottom:20px;
">

<label><b>Filter Date :</b></label>

<input
type="date"
id="filterDate"
onchange="load()"
style="
padding:8px;
margin-left:10px;
">

</div>

<table
style="
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
">

<thead>

<tr style="
background:#1e3a5f;
color:white;
">

<th style="padding:12px;">Student</th>

<th>Class</th>

<th>Subject</th>

<th>Homework Given</th>

<th>File</th>

<th>Date</th>

</tr>

</thead>

<tbody id="body">

</tbody>

</table>

<script>

async function load(){

const filterDate =
document.getElementById(
"filterDate"
).value;

const res =
await fetch(
"https://academy-backend-eatl.onrender.com/api/teacher-homeworks"
);

const data =
await res.json();

let html = "";

data.forEach(x=>{

if(
filterDate &&
x.date !== filterDate
){
return;
}

html += `

<tr>

<td style="padding:10px;">
${x.studentName || "-"}
</td>

<td>
${x.className || "-"}
</td>

<td>
${x.subject || "-"}
</td>

<td>
${x.homework || "-"}
</td>

<td>

${
x.driveLink ?

`<a href="${x.driveLink}"
target="_blank">

Download

</a>`

:

"-"

}

</td>

<td>
${x.date || "-"}
</td>

</tr>

`;

});

document
.getElementById("body")
.innerHTML = html;

}

load();

</script>
