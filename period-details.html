<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Period Details</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="dashboard-page">

<div id="sidebar-container"></div>



<script>
fetch("sidebar.html")
.then(res=>res.text())
.then(data=>{
document.getElementById("sidebar-container").innerHTML=data;
});

function openUploadPopup(){

document.getElementById(
"chapterPopup"
).style.display="block";

}

function closePopup(){

document.getElementById(
"chapterPopup"
).style.display="none";

}
</script>

<div class="main-content">

<h2>Period Details</h2>

<!-- Period Information Card -->

<div id="periodCard" class="card">

Loading...

</div>

<br><br>

<h2>Chapter Documents</h2>

<table border="1" width="100%">

<thead>

<tr>

<th>Date</th>

<th>Chapter No</th>

<th>Chapter Name</th>

<th>Topic Name</th>

<th>Upload</th>

<th>View</th>

<th>Action</th>

</tr>

</thead>

<tbody id="chapterBody">

</tbody>

</table>

<br>

<button
onclick="openUploadPopup()"
style="
background:#0b5ed7;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
">

+ Upload New Chapter

</button>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const scheduleId = params.get("scheduleId");

loadPeriodDetails();

async function loadPeriodDetails(){

    const token = localStorage.getItem("token");

    const res = await fetch(
        "https://academy-backend-eatl.onrender.com/api/founder/period/" + scheduleId,
        {
            headers:{
                "Authorization":"Bearer " + token
            }
        }
    );

    const data = await res.json();

    if(!data.schedule){

        document.getElementById("periodCard").innerHTML =
        "<h3>Period not found</h3>";

        return;
    }

    const s = data.schedule;

    const students = data.assignments || [];

const studentNames = students
.map(x => x.student ? x.student.name : "")
.filter(x => x !== "");

    document.getElementById("periodCard").innerHTML = `

<h2>${s.subject || s.eca || s.language}</h2>

<hr>

<p><b>Teacher :</b> ${s.teacher.name}</p>

<p><b>Class :</b> ${s.className}</p>

<p><b>Day :</b> ${s.day}</p>

<p><b>Time :</b> ${s.startTime} - ${s.endTime}</p>

<p><b>No Of Students :</b> ${studentNames.length}</p>

<p><b>Students :</b></p>

<ul>

${studentNames.map(name=>`<li>${name}</li>`).join("")}

</ul>

`;

}

</script>

<!-- ================= Upload Chapter Popup ================= -->

<div
id="chapterPopup"
style="
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.45);
z-index:9999;
">

<div
style="
width:500px;
background:white;
margin:70px auto;
padding:25px;
border-radius:12px;
">

<h2>Upload Chapter</h2>

<br>

<label>Chapter No</label>

<input
type="text"
id="chapterNo"
style="width:100%;padding:10px;">

<br><br>

<label>Chapter Name</label>

<input
type="text"
id="chapterName"
style="width:100%;padding:10px;">

<br><br>

<label>Topic Name</label>

<input
type="text"
id="topicName"
style="width:100%;padding:10px;">

<br><br>

<label>Select Document</label>

<input
type="file"
id="chapterFile">

<br><br>

<button
onclick="uploadChapter()"
style="
background:green;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
">

Upload

</button>

<button
onclick="closePopup()"
style="
background:red;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
margin-left:10px;
">

Cancel

</button>

</div>

</div>

</body>

</html>
