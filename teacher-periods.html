color:white;

.mobile-card .class-name{

.mobile-card .subject{

font-size:15px;

}

.mobile-card .time{

margin-top:8px;
font-size:14px;

#upcomingClasses,

/* HIDE DESKTOP UI */

#timetable{

}

table{
display:none;
}

h2{
display:none;
}

.main-content{
margin-left:0;
padding:15px;
}

}

@media(max-width:768px){

.desktop-sidebar{

.mobile-header{

.home-btn{

justify-content:space-between;

<div class="main-content">

onclick="window.location.href='teacher-dashboard.html'">

🏠

<!-- WEEKLY TIMETABLE -->

<h2 style="
margin-top:30px;
margin-bottom:15px;
color:#0f2d52;
">
📅 Weekly Timetable
</h2>

</div>

<h2 style="margin-top:30px;">Assigned Students</h2>

<table border="1" width="100%">
<thead>
<tr>
<th>Class</th>
<th>Subject</th>
<th>Day</th>
<th>Time</th>
<th>Students</th>
</tr>
</thead>

</table>

</div>

<script>

const token = sessionStorage.getItem("token");
const role = sessionStorage.getItem("role");

if (!token || role !== "teacher") {
    alert("Please login first");
    window.location.href = "teacher-login.html";
}
let studentData = [];

async function loadStudentCounts(){
const res = await fetch(
"https://academy-backend-eatl.onrender.com/api/teacher/all-period-assignments",
{
headers:{ "Authorization":"Bearer " + token }
}
);

const data = await res.json();
studentData = data.data || [];
}
/* LOAD TIMETABLE */

async function loadTimetable(){

    const res = await fetch(
        "https://academy-backend-eatl.onrender.com/api/teacher/all-period-assignments",
        {
            headers:{ "Authorization":"Bearer "+token }
        }
    );

    const data = await res.json();

    console.log(data.data);

    studentData = data.data || [];

    renderGrid(studentData); 



}



/* LOAD STUDENTS FROM PERIOD DB */

async function loadStudents(){

const res = await fetch(
"https://academy-backend-eatl.onrender.com/api/teacher/all-period-assignments",
{
headers:{ "Authorization":"Bearer "+token }
}
);

const data = await res.json();

const table = document.getElementById("studentTable");

table.innerHTML = "";

data.data.forEach(d=>{

table.innerHTML += `
<tr>
<td>${d.className}</td>
<td>${d.subject}</td>
<td>${d.day}</td>
<td>${d.startTime} - ${d.endTime}</td>
<td>${d.student ? d.student.name : "-"}</td>
</tr>
`;

});

}
function formatTime(time){

let [hour, minute] = time.split(":");

hour = parseInt(hour);

let ampm = hour >= 12 ? "PM" : "AM";

hour = hour % 12;
hour = hour ? hour : 12; // 0 → 12

return `${hour}:${minute} ${ampm}`;
}
function getClassStatus(day, startTime, endTime){

const now = new Date();

const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

const todayName = days[now.getDay()];

/* BLOCK OTHER DAYS */
if(day !== todayName){
    return "disabled";
}

/* START TIME */
const [sh, sm] = startTime.split(":");
const start = new Date();
start.setHours(sh, sm, 0);

/* ✅ FIX: USE REAL END TIME */
const [eh, em] = endTime.split(":");
const end = new Date();
end.setHours(eh, em, 0);

/* 10 MIN BEFORE */
const tenMinBefore = new Date(start.getTime() - 10 * 60000);

/* STARTING SOON */
if(now >= tenMinBefore && now < start){
    return "starting-soon";
}

/* LIVE */
if(now >= start && now <= end){
    return "live";
}

/* UPCOMING */
if(now < tenMinBefore){
    return "upcoming";
}

/* DONE */
return "completed";
}

function getTimeText(startTime, endTime){

const now = new Date();

/* START */
const [sh, sm] = startTime.split(":");
const start = new Date();
start.setHours(sh, sm, 0);

/* END */
const [eh, em] = endTime.split(":");
const end = new Date();
end.setHours(eh, em, 0);

/* BEFORE CLASS */
if(now < start){

const diff = Math.floor((start - now)/1000);

const min = Math.floor(diff / 60);
const sec = diff % 60;

return `⏳ Starts in ${min}:${sec.toString().padStart(2,'0')}`;
}

/* DURING CLASS */
if(now >= start && now <= end){

const diff = Math.floor((end - now)/1000);

const min = Math.floor(diff / 60);
const sec = diff % 60;

return `🟢 Ends in ${min}:${sec.toString().padStart(2,'0')}`;
}

/* AFTER */
return "⚪ Completed";

}
function renderGrid(schedule){

const days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

const container = document.getElementById("timetable");
container.innerHTML = "";

const weeklyContainer =
document.getElementById(
"weeklyContent"
);

weeklyContainer.innerHTML = "";

const todayBox =
document.getElementById(
"todayClasses"
);

const upcomingBox =
document.getElementById(
"upcomingClasses"
);

const completedBox =
document.getElementById(
"completedClasses"
);

todayBox.innerHTML =
'<div class="mobile-section"><h3>TODAY\'S CLASSES</h3></div>';

upcomingBox.innerHTML =
'<div class="mobile-section"><h3>UPCOMING CLASSES</h3></div>';

completedBox.innerHTML =
'<div class="mobile-section"><h3>COMPLETED CLASSES</h3></div>';

container.className = "timetable-container";

/* GROUP BY DAY */
const grouped = {};

days.forEach(d => grouped[d] = []);

schedule.forEach(s=>{

    const existing = grouped[s.day].find(p=>

        p.className === s.className &&

        p.subject === s.subject &&

        p.language === s.language &&

        p.eca === s.eca &&

        p.startTime === s.startTime &&

        p.endTime === s.endTime

    );

    if(existing){

        if(s.student){

            existing.students.push(s.student);

        }

    }else{

        console.log(s);

        grouped[s.day].push({

    _id: s.periodId,

    className:s.className,

    subject:s.subject,

    language:s.language,

    eca:s.eca,

    day:s.day,

    startTime:s.startTime,

    endTime:s.endTime,

    students: s.students || []

});

    }

});
// 🔥 SORT BY TIME
days.forEach(day => {
    grouped[day].sort((a, b) => a.startTime.localeCompare(b.startTime));
});
/* TIME FORMAT */
function formatTime(t){
let [h,m] = t.split(":");
h = parseInt(h);

let ampm = h >= 12 ? "PM" : "AM";
h = h % 12 || 12;

return `${h}:${m} ${ampm}`;
}

/* BUILD UI */
days.forEach(day=>{

const column = document.createElement("div");
column.className = "day-column";
column.innerHTML = `<div class="day-header">${day}</div>`;
grouped[day].forEach(s=>{

const match = studentData.find(p => {

const classMatch = p.className.trim() === s.className.trim();

const subjectMatch =
(p.subject && s.subject && p.subject === s.subject) ||
(p.languages && (p.languages.includes(s.subject) || p.languages.includes(s.language))) ||
(p.eca && (p.eca.includes(s.subject) || p.eca.includes(s.eca)));

const dayMatch = p.day === s.day;

const timeMatch = p.startTime.trim().startsWith(s.startTime.trim());

return classMatch && subjectMatch && dayMatch && timeMatch;

});

const count = match?.students?.length || 0;

const div = document.createElement("div");
const timeText = getTimeText(s.startTime, s.endTime);
/* CLICK */
div.style.cursor = "pointer";

div.onclick = () => {

const status = getClassStatus(s.day, s.startTime, s.endTime);



/* ❌ BLOCK IF NOT LIVE OR STARTING SOON */
if(status !== "live" && status !== "starting-soon"){
    alert("Class is not active now ❌");
    return;
}

window.location.href =
"period-students.html?" +
"periodId=" + encodeURIComponent(s._id) +
"&className=" + encodeURIComponent(s.className) +
"&subject=" + encodeURIComponent(s.subject || "") +
"&eca=" + encodeURIComponent(s.eca || "") +
"&language=" + encodeURIComponent(s.language || "") +
"&day=" + encodeURIComponent(s.day) +
"&startTime=" + encodeURIComponent(s.startTime)+
"&endTime=" + encodeURIComponent(s.endTime);
};

/* TYPE */
let typeClass = "period-card";

if(s.subject?.toLowerCase().includes("math")) typeClass += " math";
else if(s.subject?.toLowerCase().includes("science")) typeClass += " science";
else if(s.language) typeClass += " language";
else if(s.eca) typeClass += " eca";

/* STATUS */
const status = getClassStatus(s.day, s.startTime, s.endTime);

div.className = typeClass + " " + status;

/* LABEL */
let statusLabel = "";

if(status === "live") statusLabel = "🟢 LIVE";
else if(status === "starting-soon") statusLabel = "⏳ Starts in 10 mins";
else if(status === "upcoming") statusLabel = "🟡 UPCOMING";
else if(status === "completed") statusLabel = "⚪ DONE";
else statusLabel = "❌ Not Today";

const mobileCard = `

<div
class="mobile-card"
onclick="openPeriod(
'${s._id}',
'${s.className}',
'${s.subject || ""}',
'${s.eca || ""}',
'${s.language || ""}',
'${s.day}',
'${s.startTime}',
'${s.endTime}'
)"
style="cursor:pointer;"
>

<div class="class-name">
${s.className}
</div>

<div class="subject">
${s.subject || s.eca || s.language}
</div>

<div class="time">
${formatTime(s.startTime)}
-
${formatTime(s.endTime)}
</div>

<div class="status">
${statusLabel}
</div>

</div>

`;


/* HTML */
div.innerHTML = `

<div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold;">
<span>${s.className}</span>
<span>${statusLabel}</span>
</div>

<div style="margin-top:4px;">
📘 ${s.subject || s.eca || s.language}
</div>

<div style="margin-top:4px;">
⏰ ${formatTime(s.startTime)} - ${formatTime(s.endTime)}<br>
${timeText}
</div>

<div style="margin-top:4px;">
👥 ${count} students
</div>

`;

if(status === "live" ||
   status === "starting-soon"){

    todayBox.innerHTML += mobileCard;

}
else if(status === "upcoming"){

    upcomingBox.innerHTML += mobileCard;

}
else if(status === "completed"){

    completedBox.innerHTML += mobileCard;

}

column.appendChild(div);

});

const weeklyDay =
document.createElement("div");

weeklyDay.innerHTML = `

<div style="
background:#0f2d52;
color:white;
padding:10px;
border-radius:10px;
font-weight:bold;
margin-top:15px;
margin-bottom:10px;
">
${day}
</div>

`;

grouped[day].forEach(period=>{

weeklyDay.innerHTML += `

<div style="
background:white;
padding:12px;
border-radius:12px;
margin-bottom:10px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
">

<b>${period.className}</b><br>

📘 ${period.subject || period.eca || period.language}<br>

⏰ ${formatTime(period.startTime)}
-
${formatTime(period.endTime)}

</div>

`;

});

weeklyContainer.appendChild(
weeklyDay
);

container.appendChild(column);

});

}

function openPeriod(
periodId,
className,
subject,
eca,
language,
day,
startTime,
endTime
){

const status =
getClassStatus(
day,
startTime,
endTime
);

if(
status !== "live" &&
status !== "starting-soon"
){
alert("Class is not active now ❌");
return;
}

window.location.href =
"period-students.html?" +
"periodId=" + encodeURIComponent(periodId) +
"&className=" + encodeURIComponent(className) +
"&subject=" + encodeURIComponent(subject) +
"&eca=" + encodeURIComponent(eca) +
"&language=" + encodeURIComponent(language) +
"&day=" + encodeURIComponent(day) +
"&startTime=" + encodeURIComponent(startTime) +
"&endTime=" + encodeURIComponent(endTime);

}

setInterval(() => {
    loadTimetable();
}, 10000);
loadTimetable();
loadStudents();

</script>
